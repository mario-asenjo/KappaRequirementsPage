name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quest tree tests
        run: npm run test:quests

      - name: Progress model tests
        run: npm run test:progress

      - name: Progress import tests
        run: npm run test:import

      - name: EFT log extractor tests
        run: npm run test:extractor

      - name: Extractor download tests
        run: npm run test:extractor-download

      - name: Achievements page tests
        run: npm run test:achievements

      - name: Map data tests
        run: npm run test:maps

      - name: Map marker tests
        run: npm run test:map-markers

      - name: Production build
        run: npm run build
